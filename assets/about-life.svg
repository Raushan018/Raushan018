<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">About life</title>
  <desc id="desc">Raushan's developer introduction, interests, and goals.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#070b16"/><stop offset="1" stop-color="#101b37"/></linearGradient>
    <style>
      .blink { animation: blink 2.8s ease-in-out infinite; }
      .rise { animation: rise 5s ease-in-out infinite; }
      @keyframes blink { 50% { opacity: .25; } }
      @keyframes rise { 50% { transform: translateY(-5px); } }
    </style>
  </defs>
  <rect width="1000" height="330" rx="26" fill="url(#bg)" stroke="#23365f"/>
  <path d="M52 82H948" stroke="#1b2c50"/>
  <circle cx="72" cy="48" r="6" fill="#ff354f"/><circle cx="94" cy="48" r="6" fill="#247bff"/><circle cx="116" cy="48" r="6" fill="#50688e"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="54" y="126" fill="#247bff" font-size="17" font-weight="700" letter-spacing="3">ABOUT THE BUILDER</text>
    <text x="54" y="170" fill="#f4f7ff" font-size="28" font-weight="700">I turn curious ideas into useful products.</text>
    <text x="54" y="207" fill="#b7c7e8" font-size="18">I enjoy building thoughtful web experiences, connected devices,</text>
    <text x="54" y="235" fill="#b7c7e8" font-size="18">and computer-vision systems that solve real problems.</text>
    <g class="rise">
      <text x="54" y="282" fill="#ff7080" font-size="15" font-weight="700">NOW EXPLORING</text>
      <text x="205" y="282" fill="#f4f7ff" font-size="15">system design  /  cloud  /  open source</text>
    </g>
    <circle class="blink" cx="916" cy="126" r="8" fill="#ff354f"/>
    <path d="M916 144v88M916 232l-24 24M916 232l24 24" stroke="#247bff" stroke-width="2"/>
  </g>
</svg>
